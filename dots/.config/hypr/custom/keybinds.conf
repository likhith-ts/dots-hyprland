# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User

bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above

##! Extra
bind = Super, R, exec, rofi -show drun -show-icons #Jarvis search (rofi)
bind = Super, Space, exec, nwg-drawer #Apps grid (nwg-drawer)
# bind = ALT, Tab, cyclenext, # [hidden] Switch to next window
# bind = ALT, Tab, bringactivetotop, # [hidden]

# Toggle Kalk (Show/Hide) - use your preferred key instead of 'C'
# Smart Toggle: Launch Kalk if not running, otherwise toggle workspace
bind = Ctrl+Super, C, exec, sh -c 'if hyprctl clients -j | grep -q "org.kde.kalk"; then hyprctl dispatch togglespecialworkspace kalk; else hyprctl dispatch exec "[workspace special:kalk silent; float; size 400 550; move 100%-400 0] kalk" && sleep 0.3 && hyprctl dispatch togglespecialworkspace kalk; fi' #[hidden] Calculator
#
# # Hide Kalk with Escape (only if it is the focused window)
# bind = , Escape, exec, hyprctl activewindow | grep -q "class: org.kde.kalk" && hyprctl dispatch togglespecialworkspace kalk # [hidden]close Calculator

##! Minimize
bind = Super, H, exec, ~/.config/hypr/custom/scripts/minimize.sh minimize # Minimize window
bind = Super+Shift, H, exec, ~/.config/hypr/custom/scripts/minimize.sh toggle # Toggle minimized view
bind = Ctrl+Super, H, exec, ~/.config/hypr/custom/scripts/minimize.sh restore-all # Restore all minimized
